<!doctype html>
<html lang="zh-CN" data-theme="light">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <title>foundry-quota-sentinel</title>
        <style>
            [data-theme="light"] {
                --bg: linear-gradient(
                    180deg,
                    #e8deff 0%,
                    #dcd7fc 30%,
                    #f5ecff 60%,
                    #ffece8 100%
                );
                --text: #1a1a2e;
                --text-sec: #94a3b8;
                --text-ter: #7c3aed;
                --card: rgba(255, 255, 255, 0.18);
                --modal: #ffffff;
                --card-bd: rgba(255, 255, 255, 0.7);
                --card-sh: 0 8px 32px rgba(0, 0, 0, 0.05);
                --hdr-bd: rgba(0, 0, 0, 0.03);
                --input-bg: rgba(255, 255, 255, 0.85);
                --input-bd: rgba(99, 102, 241, 0.2);
                --accent: #6366f1;
                --accent-rgb: 99, 102, 241;
                --accent2: #a855f7;
                --green: #22c55e;
                --green-dim: rgba(34, 197, 94, 0.25);
                --red: #ef4444;
                --amber: #f59e0b;
                --bs-sec: rgba(0, 0, 0, 0.03);
                --fl-on-bg: rgba(255, 255, 255, 0.8);
                --mdot-bg: #22c55e;
                --mdot-sh: rgba(34, 197, 94, 0.3);
                --st-col: #94a3b8;
                --ql-col: #1a1a2e;
                --glow: 0 0 0 1px rgba(255, 255, 255, 0.6) inset;
                --ch-in: #818cf8;
                --ch-out: #f472b6;
                --mt-op: 0.5;
            }
            [data-theme="dark"] {
                --bg: linear-gradient(
                    180deg,
                    #08081a 0%,
                    #10102e 40%,
                    #1a0a1e 100%
                );
                --text: #c8d6e5;
                --text-sec: #64748b;
                --text-ter: #00b8ff;
                --card: rgba(255, 255, 255, 0.06);
                --modal: #16162f;
                --card-bd: rgba(255, 255, 255, 0.06);
                --card-sh: 0 8px 32px rgba(0, 0, 0, 0.5);
                --hdr-bd: rgba(255, 255, 255, 0.04);
                --input-bg: rgba(255, 255, 255, 0.03);
                --input-bd: rgba(0, 255, 136, 0.15);
                --accent: #00ff88;
                --accent-rgb: 0, 255, 136;
                --accent2: #00b8ff;
                --green: #00ff88;
                --green-dim: rgba(0, 255, 136, 0.12);
                --red: #ff3366;
                --amber: #ff8800;
                --bs-sec: rgba(0, 255, 136, 0.03);
                --fl-on-bg: rgba(0, 255, 136, 0.06);
                --mdot-bg: #00ff88;
                --mdot-sh: rgba(0, 255, 136, 0.4);
                --st-col: #64748b;
                --ql-col: #94a3b8;
                --glow: 0 0 0 1px rgba(255, 255, 255, 0.03) inset;
                --ch-in: #38bdf8;
                --ch-out: #fb7185;
                --mt-op: 0.75;
            }
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-weight: 400 !important;
            }
            @font-face {
                font-family: "UbuntuMono Nerd Font";
                src: url("UbuntuMonoNerdFont-Regular.ttf") format("truetype");
                font-weight: 400;
                font-style: normal;
                font-display: swap;
            }
            body {
                font-family:
                    "UbuntuMono Nerd Font", -apple-system, BlinkMacSystemFont,
                    "SF Pro Display", "Inter", "Noto Sans SC", sans-serif;
                background: var(--bg);
                width: 100%;
                overflow: hidden;
                user-select: none;
                color: var(--text);
                -webkit-font-smoothing: antialiased;
                transition:
                    background 0.3s,
                    color 0.3s;
            }
            .p {
                display: flex;
                flex-direction: column;
                height: 100vh;
            }
            .h {
                padding: 7px 12px 5px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                flex-shrink: 0;
                background: var(--card);
                backdrop-filter: blur(30px);
                -webkit-backdrop-filter: blur(30px);
                border-bottom: 1px solid var(--hdr-bd);
                box-shadow: var(--glow);
            }
            .hl {
                display: flex;
                align-items: center;
                gap: 6px;
                cursor: grab;
                position: relative;
            }
            .hl:active {
                cursor: grabbing;
            }
            .hl::after {
                content: "";
                position: absolute;
                inset: -4px -4px -4px 0;
                z-index: 5;
            }
            .ic {
                width: 18px;
                height: 18px;
                border-radius: 5px;
                background: linear-gradient(
                    135deg,
                    var(--accent),
                    var(--accent2)
                );
                display: flex;
                align-items: center;
                justify-content: center;
                color: #fff;
                font-size: 8px;
                font-weight: 700;
                box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.3);
            }
            .hl h1 {
                font-size: 12px;
                font-weight: 700;
                color: var(--text);
            }
            .hr {
                display: flex;
                align-items: center;
                gap: 4px;
            }
            .sd {
                width: 5px;
                height: 5px;
                border-radius: 50%;
                background: var(--green);
                box-shadow: 0 0 0 2px var(--green-dim);
                transition: background 0.3s;
            }
            .sd.er {
                background: var(--red);
                box-shadow: 0 0 0 2px rgba(255, 51, 102, 0.2);
            }
            .ht {
                font-size: 10px;
                color: var(--text-sec);
                font-weight: 600;
                font-feature-settings: "tnum";
            }
            .ht.er {
                color: var(--red);
            }
            .hb {
                width: 20px;
                height: 20px;
                border-radius: 4px;
                border: none;
                background: transparent;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 10px;
                color: var(--text-sec);
                transition: all 0.2s;
                position: relative;
                z-index: 6;
            }
            .hb:hover {
                background: rgba(var(--accent-rgb), 0.12);
                color: var(--accent);
            }
            .hb.on {
                background: var(--accent);
                color: #fff;
                box-shadow: 0 0 6px rgba(var(--accent-rgb), 0.3);
            }
            .qb {
                width: 20px;
                height: 20px;
                border-radius: 4px;
                border: none;
                background: transparent;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 11px;
                color: var(--text-sec);
                transition: all 0.2s;
                position: relative;
                z-index: 6;
            }
            .qb:hover {
                background: rgba(239, 68, 68, 0.1);
                color: var(--red);
            }
            .ct {
                flex: 1;
                overflow: hidden;
                position: relative;
            }
            .tc {
                position: absolute;
                inset: 0;
                overflow-y: auto;
                padding: 8px 12px 10px;
                opacity: 0;
                visibility: hidden;
                transition:
                    opacity 0.2s,
                    visibility 0.2s;
                scrollbar-width: thin;
            }
            .tc::-webkit-scrollbar {
                width: 3px;
            }
            .tc::-webkit-scrollbar-thumb {
                background: var(--bs-sec);
                border-radius: 10px;
            }
            .tc.act {
                opacity: 1;
                visibility: visible;
            }
            .tb {
                display: flex;
                flex-shrink: 0;
                height: 30px;
                background: var(--card);
                backdrop-filter: blur(30px);
                -webkit-backdrop-filter: blur(30px);
                border-top: 1px solid var(--hdr-bd);
                padding: 2px 12px;
                gap: 6px;
            }
            .tl {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 10px;
                font-weight: 600;
                letter-spacing: 0.4px;
                text-transform: uppercase;
                color: var(--text-sec);
                cursor: pointer;
                border-radius: 5px;
                transition: all 0.2s;
            }
            .tl:hover {
                color: var(--accent);
            }
            .tl.act {
                background: var(--card);
                color: var(--accent);
                box-shadow: var(--card-sh);
            }
            .st {
                font-size: 9px;
                font-weight: 700;
                color: var(--st-col);
                letter-spacing: 0.5px;
                text-transform: uppercase;
                margin-bottom: 4px;
                display: flex;
                align-items: center;
                gap: 4px;
            }
            .st::before {
                content: "";
                display: inline-block;
                width: 2px;
                height: 8px;
                border-radius: 2px;
                background: linear-gradient(
                    180deg,
                    var(--accent),
                    var(--accent2)
                );
            }
            /* quota */
            .qn {
                margin-bottom: 6px;
                background: var(--card);
                backdrop-filter: blur(30px);
                -webkit-backdrop-filter: blur(30px);
                border-radius: 10px;
                padding: 6px 12px;
                border: var(--card-bd);
                box-shadow: var(--card-sh), var(--glow);
            }
            .qr {
                display: flex;
                align-items: center;
                gap: 6px;
                margin-bottom: 3px;
                height: 20px;
            }
            .ql {
                font-size: 10px;
                font-weight: 600;
                color: var(--ql-col);
                width: 48px;
                flex-shrink: 0;
            }
            .qbw {
                flex: 1;
                height: 6px;
                border-radius: 3px;
                background: var(--bs-sec);
                overflow: hidden;
            }
            .qf {
                height: 100%;
                border-radius: 3px;
                transition:
                    width 0.8s cubic-bezier(0.22, 1, 0.36, 1),
                    background 0.3s;
            }
            .qf.g1 {
                background: linear-gradient(90deg, #6366f1, #a855f7, #ec4899);
            }
            .qf.g2 {
                background: linear-gradient(90deg, #f59e0b, #ef4444, #ec4899);
            }
            .qf.g3 {
                background: linear-gradient(90deg, #06b6d4, #3b82f6, #6366f1);
            }
            .qf.warn {
                background: linear-gradient(90deg, var(--amber), #ef4444);
            }
            .qf.danger {
                background: var(--red);
            }
            .qp {
                font-size: 10px;
                font-weight: 700;
                font-feature-settings: "tnum";
                min-width: 32px;
                text-align: right;
            }
            .qp.g1 {
                color: #a855f7;
            }
            .qp.g2 {
                color: #ef4444;
            }
            .qp.g3 {
                color: #3b82f6;
            }
            .qp.warn {
                color: var(--amber);
            }
            .qp.danger {
                color: var(--red);
            }
            .qtm {
                font-size: 9px;
                color: var(--text-sec);
                font-weight: 500;
                min-width: 18px;
                text-align: right;
                font-feature-settings: "tnum";
            }
            /* today - now has enough width */
            .tg {
                display: flex;
                gap: 5px;
                margin-bottom: 6px;
            }
            .ti {
                flex: 1;
                background: var(--card);
                backdrop-filter: blur(30px);
                -webkit-backdrop-filter: blur(30px);
                border-radius: 10px;
                padding: 6px 4px;
                text-align: center;
                border: var(--card-bd);
                box-shadow: var(--card-sh), var(--glow);
            }
            .tn {
                font-size: 11px;
                font-weight: 800;
                font-feature-settings: "tnum";
                line-height: 1.3;
            }
            .tn.g1 {
                color: #6366f1;
            }
            .tn.g2 {
                color: #ef4444;
            }
            .tn.g3 {
                color: #22c55e;
            }
            .tn.g4 {
                color: #a855f7;
            }
            .tl {
                font-size: 8px;
                color: var(--text-sec);
                font-weight: 600;
                letter-spacing: 0.4px;
                text-transform: uppercase;
            }
            .acard {
                background: var(--card);
                border: var(--card-bd);
                border-radius: 10px;
                padding: 8px 10px;
                margin-bottom: 8px;
                box-shadow: var(--card-sh);
            }
            .acard-h {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 6px;
                margin-bottom: 6px;
            }
            .acard-dot {
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: linear-gradient(
                    135deg,
                    var(--accent),
                    var(--accent2)
                );
                flex-shrink: 0;
            }
            .acard-name {
                font-size: 11px;
                font-weight: 700;
                color: var(--text);
            }
            .ctype {
                font-size: 9px;
                font-weight: 600;
                color: var(--text-sec);
                text-transform: uppercase;
                letter-spacing: 0.3px;
            }
            .cname {
                font-size: 12px;
                font-weight: 700;
                color: var(--text);
            }
            .qerr {
                font-size: 11px;
                color: var(--red);
                padding: 4px 0;
                text-align: center;
            }
            /* balance */
            .bc {
                background: var(--card);
                backdrop-filter: blur(30px);
                -webkit-backdrop-filter: blur(30px);
                border-radius: 10px;
                padding: 6px 12px;
                margin-bottom: 6px;
                border: var(--card-bd);
                box-shadow: var(--card-sh), var(--glow);
                display: flex;
                flex-direction: column;
                gap: 2px;
            }
            .bc-r {
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            .bl {
                font-size: 11px;
                color: var(--text-sec);
                font-weight: 500;
            }
            .bv {
                font-size: 14px;
                font-weight: 800;
                font-feature-settings: "tnum";
                background: linear-gradient(135deg, var(--green), #06b6d4);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
            }
            /* Shared row-detail extension (secondary line directly below a
               standard meter row, e.g. Kimi's Monthly Kimi/Code breakdown).
               Namespaced per-label classes (.qrd-*) own only the unique
               content colors; .qrd owns the shared layout. */
            .qrd {
                font-size: 11px;
                color: var(--text-sec);
            }
            .qrd-kimi {
                color: var(--text);
            }
            .qrd-code {
                color: var(--accent);
                margin-left: 8px;
            }
            /* Shared account action button (re-login etc., error state):
               semantic button with themed idle, hover, active, and
               keyboard-focus states. Applies to EVERY provider's action
               (Ollama's olLogin included) so no provider falls back to the
               browser-native gray button. Provider-specific classes
               (.kimiLogin/.olLogin) remain for event delegation; the
               shared .qact class owns the visual contract. */
            .qact {
                background: none;
                border: none;
                padding: 0;
                font: inherit;
                color: var(--text-sec);
                cursor: pointer;
            }
            .qact:hover {
                text-decoration: underline;
            }
            .qact:active {
                opacity: 0.75;
            }
            .qact:focus-visible {
                outline: 1px solid var(--accent);
                outline-offset: 2px;
                border-radius: 3px;
            }
            /* Provider-specific action classes: delegation hooks only; the
               shared .qact styles apply to both. */
            .kimiLogin,
            .olLogin {
                color: var(--text-sec);
            }
            .bc-d {
                font-size: 8px;
                color: var(--text-sec);
                font-weight: 500;
                display: flex;
                gap: 14px;
                justify-content: flex-end;
                opacity: 0.7;
            }
            /* filters */
            .fw {
                display: flex;
                gap: 3px;
                margin-bottom: 5px;
                background: var(--card);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                border-radius: 6px;
                padding: 3px;
            }
            .fl {
                padding: 3px 10px;
                font-size: 10px;
                font-weight: 600;
                border-radius: 4px;
                cursor: pointer;
                color: var(--text-sec);
                transition: all 0.2s;
                white-space: nowrap;
            }
            .fl-on {
                background: var(--fl-on-bg);
                color: var(--accent);
                box-shadow: var(--fl-on-sh);
            }
            .fl:hover {
                color: var(--accent);
            }
            .dr {
                display: none;
                flex-wrap: wrap;
                gap: 4px;
                align-items: center;
                margin-bottom: 5px;
            }
            .dr.on {
                display: flex;
            }
            .dr-in {
                flex: 1;
                min-width: 70px;
                font-size: 10px;
                padding: 4px 6px;
                border: 1px solid var(--input-bd);
                border-radius: 4px;
                background: var(--input-bg);
                color: var(--text);
                font-family: inherit;
                font-weight: 500;
            }
            .dr-in:focus {
                outline: none;
                border-color: var(--accent);
                box-shadow: 0 0 0 2px rgba(var(--accent-rgb), 0.15);
            }
            .dr-sep {
                font-size: 10px;
                color: var(--text-sec);
                font-weight: 600;
            }
            .dr .go {
                padding: 4px 8px;
                font-size: 10px;
                font-weight: 700;
                border-radius: 4px;
                cursor: pointer;
                background: linear-gradient(
                    135deg,
                    var(--accent),
                    var(--accent2)
                );
                color: #fff;
                border: none;
                transition: all 0.2s;
            }
            /* model list - full names, no ellipsis */
            .ml {
                display: flex;
                flex-direction: column;
                gap: 3px;
            }
            .mi {
                display: flex;
                align-items: center;
                gap: 4px;
                padding: 5px 8px;
                border-radius: 6px;
                background: rgba(var(--cr, 148, 163, 184), 0.04);
                transition: all 0.2s;
            }
            .mi:hover {
                background: rgba(var(--cr, 148, 163, 184), 0.1);
            }
            @keyframes breathe {
                0%,
                100% {
                    box-shadow:
                        0 0 2px var(--green),
                        0 0 4px var(--green-dim);
                    opacity: 0.6;
                }
                50% {
                    box-shadow:
                        0 0 3px var(--green),
                        0 0 6px var(--green-dim),
                        0 0 10px var(--green-dim);
                    opacity: 1;
                }
            }
            .md {
                width: 6px;
                height: 6px;
                border-radius: 50%;
                flex-shrink: 0;
                background: var(--mdot-bg);
                box-shadow: 0 0 4px var(--mdot-sh);
                animation: breathe 2.4s ease-in-out infinite;
            }
            .mn {
                flex-shrink: 0;
                font-size: 11px;
                font-weight: 600;
                color: var(--text);
            }
            .mt {
                font-size: 10px;
                font-weight: 700;
                font-feature-settings: "tnum";
                color: rgba(var(--cr, 148, 163, 184), var(--mt-op, 0.5));
                flex-shrink: 0;
                margin-left: auto;
            }
            /* dashboard */
            .dc {
                background: var(--card);
                backdrop-filter: blur(30px);
                -webkit-backdrop-filter: blur(30px);
                border-radius: 10px;
                padding: 8px 12px;
                border: var(--card-bd);
                box-shadow: var(--card-sh), var(--glow);
                margin-bottom: 6px;
            }
            /* stacked bar - thin & refined */
            .bc-c {
                display: flex;
                align-items: flex-end;
                height: 100px;
                gap: 6px;
                padding: 0 4px;
                justify-content: center;
            }
            .bc-b {
                width: 26px;
                flex-shrink: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                height: 100%;
            }
            .bc-sk {
                display: flex;
                flex-direction: column-reverse;
                width: 100%;
                border-radius: 4px 4px 0 0;
                overflow: hidden;
                transition: height 0.6s cubic-bezier(0.22, 1, 0.36, 1);
                gap: 1px;
            }
            .bc-ip {
                transition: height 0.6s ease;
                background: var(--ch-in);
                opacity: 0.95;
            }
            .bc-op {
                transition: height 0.6s ease;
                background: var(--ch-out);
                opacity: 0.85;
            }
            .bc-l {
                font-size: 8px;
                color: var(--text-sec);
                font-weight: 500;
                margin-top: 3px;
                font-feature-settings: "tnum";
            }
            .bc-v {
                font-size: 7px;
                font-weight: 700;
                font-feature-settings: "tnum";
                color: var(--text-sec);
                white-space: nowrap;
                margin-bottom: 1px;
                opacity: 0.7;
                line-height: 1;
            }
            .bc-lg {
                display: flex;
                gap: 14px;
                justify-content: center;
                padding: 4px 0 0;
                border-top: 1px solid var(--hdr-bd);
                margin-top: 4px;
            }
            .bc-li {
                display: flex;
                align-items: center;
                gap: 4px;
                font-size: 8px;
                color: var(--text-sec);
                font-weight: 500;
            }
            .bc-sq {
                width: 7px;
                height: 7px;
                border-radius: 2px;
                flex-shrink: 0;
            }
            /* summary */
            .sb {
                display: flex;
                gap: 14px;
                padding: 4px 0 0;
                justify-content: center;
            }
            .sb-i {
                font-size: 9px;
                color: var(--text-sec);
                font-weight: 500;
                font-feature-settings: "tnum";
            }
            .sb-l {
                color: var(--text);
                font-weight: 700;
            }
            /* ring donut */
            .dn {
                display: flex;
                align-items: center;
                gap: 14px;
            }
            .dn-c {
                width: 84px;
                height: 84px;
                border-radius: 50%;
                flex-shrink: 0;
                box-shadow: var(--glow);
                position: relative;
            }
            .dn-c::after {
                content: attr(data-total);
                position: absolute;
                inset: 14px;
                border-radius: 50%;
                background: var(--card);
                backdrop-filter: blur(10px);
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 8px;
                font-weight: 700;
                font-feature-settings: "tnum";
                color: var(--text);
                text-align: center;
                line-height: 1.1;
                word-break: break-all;
                padding: 2px;
            }
            .dn-l {
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 2px;
            }
            .dn-i {
                display: flex;
                align-items: center;
                gap: 4px;
                font-size: 9px;
                color: var(--text-sec);
                font-weight: 500;
            }

        <script>
            var mMode = "preset",

                mTo = "",
                hData = [];
            function n(n) {
                if (n == null) return "0";
                return n.toLocaleString();
            }
            function ab(n) {
                if (n >= 1e9) return (n / 1e9).toFixed(1) + "B";
                if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
                if (n >= 1e3) return (n / 1e3).toFixed(1) + "K";
                return String(n);
            }
            /* drag */
            var dy = 0,
                ds = 0,
                dpy = 0;
            document
                .getElementById("dragHdr")
                .addEventListener("mousedown", function (e) {
                    if (e.button !== 0) return;
                    ds = e.screenY;
                    dy = dpy;
                    var fn = function (m) {
                        var d = m.screenY - ds,
                            y = Math.max(0, Math.min(3000, dy + d));
                        fetch("/api/position?y=" + y);
                        dpy = y;
                    };
                    var up = function () {
                        document.removeEventListener("mousemove", fn);
                        document.removeEventListener("mouseup", up);
                    };
                    document.addEventListener("mousemove", fn);
                    document.addEventListener("mouseup", up);
                });
            /* animate number */
            function an(el, t) {
                if (!el) return;
                var c = parseInt(el.getAttribute("dn") || "0");
                if (c === t) return;
                el.setAttribute("dn", t);
                var d = 400,
                    st = performance.now();
                function stp(nw) {
                    var p = Math.min((nw - st) / d, 1),
                        e = 1 - Math.pow(1 - p, 3),
                        v = Math.round(c + (t - c) * e);
                    el.textContent = v.toLocaleString();
                    if (p < 1) requestAnimationFrame(stp);
                }
                requestAnimationFrame(stp);
            }
            /* theme/pin/quit */
            (function () {

                .getElementById("themeBtn")
                .addEventListener("click", function () {

                    if (typeof dsRenderCharts === "function")

            document

                .then(function (r) {

                .getElementById("quitBtn")

                    });
                });
            /* quota */
            function bg(p) {
                if (p > 95) return "danger";
                if (p > 80) return "warn";
                return "";
            }
            function qesc(s) {
                return String(s).replace(/[&<>"]/g, function (c) {
                    return {
                        "&": "&amp;",
                        "<": "&lt;",
                        ">": "&gt;",
                        '"': "&quot;",
                    }[c];
                });
            }

            /* ===== Shared Quota-Card Foundation (Task 2.1-2.2) ===== */

            // formatDurationCompact formats seconds as a compact relative duration.
            // Matches Go FormatDurationCompact: floors the largest applicable whole unit.
            // Task 2.1: Pure formatter for shared quota-card reset column.
            function formatDurationCompact(seconds) {
                // Clamp invalid/expired values to safe non-negative display
                if (seconds === undefined || seconds === null || isNaN(seconds) || !isFinite(seconds) || seconds < 0) {
                    return "0s";
                }
                var s = Math.floor(seconds);
                if (s < 60) return s + "s";
                if (s < 3600) return Math.floor(s / 60) + "m";
                if (s < 86400) return Math.floor(s / 3600) + "h";
                return Math.floor(s / 86400) + "d";
            }

            // formatPercent formats a percentage with declarative precision.
            // percentPrecision: 0 = integer, 1-2 = decimal places (trailing zeros trimmed).
            function formatPercent(percent, precision) {
                if (percent === undefined || percent === null || isNaN(percent)) return "0%";
                if (precision === 0 || precision === undefined) {
                    return Math.round(percent) + "%";
                }
                // Decimal precision: round to precision, trim trailing zeros
                var rounded = Math.round(percent * Math.pow(10, precision)) / Math.pow(10, precision);
                if (rounded === 0) return "0%";
                var str = rounded.toString();
                // Trim trailing zeros after decimal point, then trim trailing decimal point
                if (str.indexOf(".") >= 0) {
                    str = str.replace(/0+$/, "").replace(/\.$/, "");
                }
                return str + "%";
            }

            // renderQuotaRow renders one standard quota row from the shared view model.
            // Task 2.2: Shared row renderer with label, track, fill, percentage, reset, details.
            // Safety: null/undefined rows and non-finite percents render a safe
            // placeholder; ONE validated value drives color, fill width, and text.
            function renderQuotaRow(row) {
                if (!row) return "";
                var label = qesc(row.label || "");
                var pct = row.percent;
                var finite = typeof pct === "number" && isFinite(pct);
                if (!finite) {
                    // Missing/invalid data row placeholder
                    return '<div class="qr"><span class="ql">' + label + '</span><span class="qtm">—</span></div>';
                }
                var tone = row.tone || "";
                var w = bg(pct);
                var bc = w || tone;
                var pctStr = formatPercent(pct, row.percentPrecision);
                var resetStr = formatDurationCompact(row.resetInSec);
                var clampedWidth = Math.max(0, Math.min(100, pct));

                var html = '<div class="qr">' +
                    '<span class="ql">' + label + '</span>' +
                    '<div class="qbw"><div class="qf ' + bc + '" style="width:' + clampedWidth + '%"></div></div>' +
                    '<span class="qp ' + bc + '">' + pctStr + '</span>' +
                    '<span class="qtm">' + resetStr + '</span>' +
                    '</div>';

                // Render row details (typed extension slot for Kimi/Code breakdown, etc.)
                if (row.details && row.details.length > 0) {
                    html += '<div class="qr qrd">';
                    for (var i = 0; i < row.details.length; i++) {
                        var d = row.details[i];
                        if (!d) continue;
                        html += '<span class="qrd-' + qesc(String(d.label || "").toLowerCase()) + '">' +
                            qesc(d.label || "") + ' ' + qesc(d.value || "") + '</span>';
                    }
                    html += '</div>';
                }
                return html;
            }

            // renderQuotaCard renders a complete quota card from the shared view model.
            // Task 2.2: Shared shell/header, error region, ordered rows, extension slots.
            function renderQuotaCard(view) {
                var body;
                if (!view.success) {
                    // Error state with optional action: rendered as a real
                    // <button> so the re-login affordance is keyboard-
                    // focusable (a span is not). The shared .qact class
                    // provides unified styling; the declared class (e.g.
                    // kimiLogin/olLogin) is retained for per-container
                    // delegated dispatch.
                    body = '<div class="qerr">' + qesc(view.error || "查询失败") + '</div>';
                    if (view.errorAction) {
                        body += '<div class="bc-d"><button type="button" class="qact ' + qesc(view.errorAction.class || "") +
                            '" data-action="relogin" data-name="' + qesc(view.accountName) + '">' +
                            qesc(view.errorAction.label) + '</button></div>';
                    }
                } else {
                    // Success state: render ordered rows
                    body = "";
                    if (view.rows && view.rows.length > 0) {
                        for (var i = 0; i < view.rows.length; i++) {
                            body += renderQuotaRow(view.rows[i]);
                        }
                    }
                }

                // Build card shell
                var html = '<div class="acard" data-prov="' + qesc(view.provider) +
                    '" data-name="' + qesc(view.accountName) + '">' +
                    '<div class="acard-h">' +
                    '<span class="ctype">' + qesc(view.providerLabel) + '</span>' +
                    '<span class="cname">' + qesc(view.accountName) + '</span>';

                // Header extension slot (badges, etc.)
                if (view.headerExtension) {
                    html += '<span class="' + qesc(view.headerExtension.class || "") + '">' +
                        qesc(view.headerExtension.content || "") + '</span>';
                }
                html += '</div>'; // .acard-h

                // Body extensions (before rows)
                if (view.bodyExtensions && view.bodyExtensions.length > 0) {
                    for (var i = 0; i < view.bodyExtensions.length; i++) {
                        var ext = view.bodyExtensions[i];
                        html += '<div class="' + qesc(ext.class || "") + '">' +
                            qesc(ext.content || "") + '</div>';
                    }
                }

                html += body;

                // Footer extension slot
                if (view.footerExtension) {
                    html += '<div class="' + qesc(view.footerExtension.class || "") + '">' +
                        qesc(view.footerExtension.content || "") + '</div>';
                }

                html += '</div>'; // .acard
                return html;
            }

            /* ===== Provider Adapters (Tasks 2.3-2.5) ===== */

            // opencodeAdapter converts OpenCode Go DTO to shared view model.
            // Task 2.3: Rolling, Weekly, optional Monthly with integer precision.
            function opencodeAdapter(a) {
                var view = {
                    provider: "opencode",
                    providerLabel: "OpenCode Go",
                    accountName: a.name,
                    success: a.success,

            }

            // ollamaAdapter converts Ollama DTO to shared view model.
            // Task 2.4: Session, Weekly (no Monthly) with re-login action on error.
            function ollamaAdapter(a) {
                var view = {
                    provider: "ollama",
                    providerLabel: "Ollama",
                    accountName: a.name,
                    success: a.success,
                    error: a.error,
                    rows: []

                } else if (a.quota) {

                        label: "Session",

                        percentPrecision: 0,

                        tone: "g1"
                    });
                    if (d.weekly) view.rows.push({
                        label: "Weekly",
                        percent: d.weekly.usage_percent,
                        percentPrecision: 0,
                        resetInSec: d.weekly.reset_in_sec,
                        tone: "g2"
                    });
                }
                return view;
            }

            // kimiAdapter converts Kimi DTO to shared view model.
            // Task 2.5: five_hour→Rolling, seven_day→Weekly, total→Monthly with decimal precision.
            function kimiAdapter(a) {
                var view = {
                    provider: "kimi",
                    providerLabel: "Kimi Code",
                    accountName: a.name,
                    success: a.success,
                    error: a.error,
                    rows: []
                };
                if (!a.success) {
                    view.errorAction = { label: "重新登录", class: "kimiLogin" };
                } else if (a.quota) {
                    var d = a.quota;
                    var t = d.total || {};
                    if (d.five_hour) view.rows.push({
                        label: "Rolling",
                        percent: d.five_hour.usage_percent,
                        percentPrecision: 2,
                        resetInSec: d.five_hour.reset_in_sec,
                        tone: "g2"
                    });
                    if (d.seven_day) view.rows.push({
                        label: "Weekly",
                        percent: d.seven_day.usage_percent,
                        percentPrecision: 2,
                        resetInSec: d.seven_day.reset_in_sec,
                        tone: "g3"
                    });
                    if (t.total_percent !== undefined) {
                        var monthlyRow = {
                            label: "Monthly",
                            percent: t.total_percent,
                            percentPrecision: 2,
                            resetInSec: t.reset_in_sec,
                            tone: "g1",
                            details: []
                        };
                        // Attach Kimi/Code breakdown as typed row detail
                        if (t.kimi_percent !== undefined) {
                            monthlyRow.details.push({ label: "Kimi", value: formatPercent(t.kimi_percent, 2) });
                        }
                        if (t.code_percent !== undefined) {
                            monthlyRow.details.push({ label: "Code", value: formatPercent(t.code_percent, 2) });
                        }
                        view.rows.push(monthlyRow);
                    }
                }
                return view;
            }

            /* ===== Legacy Renderers (removed; all cards use the shared
                   quota-card foundation via provider adapters) ===== */

            /* ===== Shared per-provider refresh scheduler =====

               Every provider's automatic AND explicit refresh goes through
               this single-flight boundary. Per provider the scheduler keeps
               one in-flight promise and one next-run timer:
               - the first load runs immediately;
               - the next automatic attempt starts 30s after the preceding
                 attempt SETTLES (recursive setTimeout, never a fixed
                 interval, so a slow request cannot overlap);
               - an explicit trigger while busy joins the pending promise
                 instead of starting a duplicate request;
               - an explicit trigger while idle runs immediately and resets
                 that provider's next-run deadline from its settlement;
               - success AND failure both clear in-flight state and rearm
                 the next automatic attempt. */
            var REFRESH_DELAY_MS = 30000;
            var refreshState = {}; // provider -> { busy, promise, timer, fn }

            function rearmProviderRefresh(provider) {
                var st = refreshState[provider];
                if (!st) return;
                st.busy = false;
                st.promise = null;
                st.timer = setTimeout(function () {
                    scheduleProviderRefresh(provider, st.fn);
                }, REFRESH_DELAY_MS);
            }

            function scheduleProviderRefresh(provider, fn) {
                var st = refreshState[provider];
                if (!st) {
                    st = refreshState[provider] = {
                        busy: false,
                        promise: null,
                        timer: 0,
                        fn: fn
                    };
                }
                if (st.busy) {
                    // Single-flight: join the in-flight refresh.
                    return st.promise;
                }
                // Idle: cancel this provider's previous next-run timer.
                if (st.timer) {
                    clearTimeout(st.timer);
                    st.timer = 0;
                }
                st.busy = true;
                // fn runs synchronously so an explicit trigger's effect is
                // immediate; the returned promise is adopted for single-flight.
                var p;
                try {
                    p = Promise.resolve(fn());
                } catch (e) {
                    p = Promise.reject(e);
                }
                st.promise = p.then(
                    function () {
                        rearmProviderRefresh(provider);
                    },
                    function () {
                        rearmProviderRefresh(provider);
                    },
                );
                return st.promise;
            }

            function acard(a) {
                // Use shared quota-card foundation via adapter (Task 2.3)
                return renderQuotaCard(opencodeAdapter(a));
            }
            async function fetchOpenCodeCards() {
                try {
                    var r = await (await fetch("/api/accounts")).json();
                    if (!r.success) throw new Error(r.error || "failed");
                    var h = "";
                    (r.data || []).forEach(function (a) {
                        h += acard(a);

                }
                function closeConfirm() {
                    cm.classList.add("hide");
                }
                delItem.addEventListener("click", function () {
                    if (!cur.prov) return;
                    // NOTE: deliberately does NOT clear in-flight state.
                    // Reopening the same account must stay blocked while its
                    // delete is in flight; only the response (or a new
                    // account) changes the per-account in-flight map.
                    pend.prov = cur.prov;
                    pend.name = cur.name;
                    // Provider label comes from the registry so every
                    // provider (including Kimi) gets its own confirm text;
                    // unknown types fall back to the raw type, never to a
                    // wrong provider's label.
                    var p = quotaProviderByType(cur.prov);
                    var label = p ? p.label : cur.prov;
                    ctext.textContent =
                        "确定删除 " +
                        label +
                        " 账户「" +
                        cur.name +
                        "」？此操作不可撤销。";
                    hide();
                    cm.classList.remove("hide");
                });
                document
                    .getElementById("confirmClose")
                    .addEventListener("click", closeConfirm);
                document
                    .getElementById("confirmCancel")
                    .addEventListener("click", closeConfirm);
                cm.addEventListener("click", function (e) {
                    if (e.target === cm) closeConfirm();
                });
                document
                    .getElementById("confirmOk")
                    .addEventListener("click", function () {
                        if (!pend.prov) return;
                        // Re-entrancy guard keyed by account: while THIS
                        // account's delete is in flight, confirming again
                        // (double-click, or close+reopen of the SAME account)
                        // must NOT send a duplicate request. Different
                        // accounts are independently deletable.
                        var deletedProvider = pend.prov;
                        var deletedName = pend.name;
                        var key = deleteKey(deletedProvider, deletedName);
                        if (inFlightDeletes[key]) return;
                        inFlightDeletes[key] = true;
                        fetch(
                            "/api/delete?provider=" +
                                encodeURIComponent(deletedProvider) +
                                "&name=" +
                                encodeURIComponent(deletedName),
                        )
                            .then(function (r) {
                                // A JSON parse failure is a malformed body
                                // (unknown delete failure), NOT a network
                                // error. Convert it to null so the failure
                                // branch below reports 未知错误; the outer
                                // .catch stays reserved for real network
                                // failures.
                                return r.json().catch(function () {
                                    return null;
                                });
                            })
                            .then(function (res) {
                                // Only touch the modal while it still shows
                                // THIS account (pend holds the last opened
                                // confirm). A stale response for a different
                                // account must not close or rewrite it.
                                var ownsDialog =
                                    pend.prov === deletedProvider &&
                                    pend.name === deletedName;
                                if (!res || res.success !== true) {
                                    // Non-success (server failure, malformed
                                    // body): release the per-account guard
                                    // immediately so the user may retry.
                                    delete inFlightDeletes[key];
                                    if (ownsDialog) {
                                        ctext.textContent =
                                            "删除失败：" +
                                            ((res && res.error) || "未知错误");
                                    }
                                    return;
                                }
                                // Close the modal only while it still shows
                                // this account; a different account's dialog
                                // must survive.
                                if (ownsDialog) {
                                    closeConfirm();
                                }
                                // Success: the delete is confirmed
                                // server-side. Keep the per-account guard
                                // until the provider refresh has replaced the
                                // card — clearing on response arrival would
                                // let the user reopen the same account and
                                // send a duplicate delete that fails with
                                // account-not-found. Refresh functions are
                                // async (return promises), so release once
                                // the refresh settles (card replaced, or
                                // refresh failed — the delete already
                                // happened server-side either way).
                                setTimeout(function () {
                                    var p = quotaProviderByType(deletedProvider);
                                    var fn = p ? window[p.refresh] : null;
                                    function release() {
                                        // The delete succeeded server-side and
                                        // the refresh has settled (old card is
                                        // gone). If the currently-open dialog
                                        // still points at THIS deleted account
                                        // (a confirm reopened before the
                                        // refresh ran), close and invalidate it
                                        // so its confirm action becomes inert —
                                        // otherwise the user could confirm the
                                        // stale dialog and delete an account
                                        // that no longer exists, showing
                                        // 删除失败. A dialog for a DIFFERENT
                                        // account is left untouched, and a
                                        // recreated same-named account gets a
                                        // fresh pend via delItem, so it stays
                                        // deletable.
                                        if (
                                            pend.prov === deletedProvider &&
                                            pend.name === deletedName
                                        ) {
                                            closeConfirm();
                                            pend.prov = "";
                                            pend.name = "";
                                        }
                                        delete inFlightDeletes[key];
                                    }
                                    if (typeof fn === "function") {
                                        Promise.resolve(fn()).then(
                                            release,
                                            release,
                                        );
                                    } else {
                                        release();
                                    }
                                }, 300);
                            })
                            .catch(function () {
                                // Only a real network failure reaches here
                                // (JSON parse failures are converted to null
                                // above).
                                delete inFlightDeletes[key];
                                if (
                                    pend.prov === deletedProvider &&
                                    pend.name === deletedName
                                ) {
                                    ctext.textContent = "删除失败：网络错误";
                                }
                            });
                    });
                document.addEventListener("click", hide);
                document.addEventListener("scroll", hide, true);
                window.addEventListener("resize", hide);
                document.addEventListener("keydown", function (e) {
                    if (e.key === "Escape") hide();
                });
            })();
            /* clock — fetch-free, renders immediately and every 1s. The
               visible time must never depend on provider network I/O; a
               slow or failed quota request cannot delay, skip, or reorder
               clock updates. Provider health/errors stay on the cards. */
            function updateClock() {
                var ht = document.getElementById("ht");
                ht.textContent = new Date().toLocaleTimeString();
                ht.className = "ht";
            }
            updateClock();
            setInterval(updateClock, 1000);
            /* Provider automatic polling: each provider loads immediately
               once; the shared scheduler then rearms the next automatic
               attempt 30s after each settlement (no overlapping requests,
               per-provider single-flight, independent timers). */
            fq();
            fd();
            fo();
            fk();
            var winTimer;
            window.addEventListener("resize", function () {
                for (var k in dsCharts) {
                    try {
                        dsCharts[k].resize();
                    } catch (e) {}
                }
                clearTimeout(winTimer);
                winTimer = setTimeout(function () {
                    fetch(
                        "/api/winsize?w=" +
                            window.outerWidth +
                            "&h=" +
                            window.outerHeight,
                    );
                }, 500);
            });
        </script>
    </body>
</html>
